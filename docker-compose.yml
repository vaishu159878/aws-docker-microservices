services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - order-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  user-service:
    build: ./user-service
    expose:
      - "3001"
    restart: unless-stopped
  order-service:
    build: ./order-service
    expose:
      - "3002"
    restart: unless-stopped
